# Hobby-plan companion to the Vercel Cron job in vercel.json (which runs the 07:00 UTC refresh).
# This workflow adds the 13:00 and 19:00 UTC refreshes (16:00 and 22:00 Cairo summer time).
# One-time setup: GitHub repo -> Settings -> Secrets and variables -> Actions, add:
#   APP_URL      e.g. https://your-app.vercel.app   (no trailing slash)
#   CRON_SECRET  the same value as the CRON_SECRET environment variable on Vercel
# GitHub may start scheduled runs a few minutes late; that is fine for metrics.
name: Refresh social metrics
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 13,19 * * *"
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Call the metrics refresh endpoint
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/scheduled/refresh-social-metrics"
